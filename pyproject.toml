[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-disk-arm-scheduler-elevator-scan-skill"
version = "1.0.0"
description = "Hard disk drive arm scheduling algorithms: SCAN (Elevator algorithm) and head movement optimization."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Operating System"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-disk-arm-scheduler-elevator-scan-skill"
Repository = "https://github.com/alphaparkinc/genpark-disk-arm-scheduler-elevator-scan-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-disk-arm-scheduler-elevator-scan-skill/issues"
